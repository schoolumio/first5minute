# Render Blueprint for a FREE-tier test deployment: API + Postgres + Redis. The website goes on Vercel (docs/DEPLOY_CLOUD.md).
#
# Free-tier facts this file is built around (check render.com/pricing: they change):
#   * the free web service falls asleep after ~15 idle minutes and takes about a minute to wake;
#   * the free Postgres database is deleted ~30 days after creation unless you upgrade it first;
#   * there is no free background worker, so the demo data refreshes itself when the API wakes (DEMO_REFRESH_HOURS).
# To go paid later you do NOT need to change this file: upgrade each service in the Render dashboard (guide, part 6).
# Not deployed from the development sandbox: if Render rejects a field, its message names the line.

databases:
  - name: f5m-db
    databaseName: projectfive
    user: five
    plan: free
    ipAllowList: []            # private network only

services:
  - type: keyvalue             # Redis: rate limiting and converter sessions (free: not persistent, which is fine here)
    name: f5m-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web                  # the API
    name: f5m-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: f5m-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: f5m-redis, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - { key: ENVIRONMENT, value: staging }        # "production" refuses demo mode; switch only when you are really live
      - { key: COOKIE_SECURE, value: "true" }
      - { key: FOOTBALL_PROVIDER, value: demo }
      - { key: ODDS_PROVIDER, value: none }
      - { key: PAYMENT_PROVIDER, value: none }
      - { key: EMAIL_BACKEND, value: console }
      - { key: BOOKING_CONVERTER_ENABLED, value: "true" }
      - { key: BOOKING_CONVERTER_DEMO, value: "true" }
      - { key: DEMO_REFRESH_HOURS, value: "24" }    # reload demo data at start-up when it is older than this
      - { key: RUN_WORKER, value: "false" }         # no room for a worker inside a free 512 MB instance
      - { key: FRONTEND_URL, sync: false }          # you type these in the Render form: your Vercel address
      - { key: CORS_ORIGINS, sync: false }
      - { key: BOOTSTRAP_ADMIN_EMAIL, sync: false } # the admin account is created on first start (never reset later)
      - { key: BOOTSTRAP_ADMIN_PASSWORD, sync: false }

